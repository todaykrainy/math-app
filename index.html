<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>パッと算数</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f4f6fb;color:#1c2333;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{height:100%;padding:14px 22px;display:flex;flex-direction:column}
h1{font-size:28px;margin:0}
h2{font-size:18px;margin:18px 0 8px;color:#4a5570}
button{font:inherit;border:0;border-radius:14px;padding:14px 18px;background:#fff;box-shadow:0 1px 0 #cfd6e6;color:inherit;cursor:pointer}
button.pri{background:#2f6bff;color:#fff;font-weight:700}
button.big{font-size:24px;padding:22px}
button.ghost{background:transparent;box-shadow:none;color:#5a6682;padding:8px 12px}
button.chip{padding:12px 16px;font-size:18px;margin:0 8px 8px 0}
button.chip.on{background:#2f6bff;color:#fff;font-weight:700}
.row{display:flex;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
.note{font-size:13px;color:#6b7691;margin:4px 0}
.card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid #eef1f7;font-size:16px}
th:first-child,td:first-child{text-align:left}
th{background:#eef1f7;font-size:14px;color:#4a5570}
.good{color:#1a9b4a}.bad{color:#d8362f}
/* 横向きレイアウト */
.rot{display:none;background:#fff3cd;padding:8px;text-align:center;font-size:15px}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hdr h1{flex:1}
.cols3{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;min-height:0;padding-bottom:6px}
.cols2{grid-template-columns:repeat(2,1fr)}
.cols4{grid-template-columns:repeat(4,1fr)}
.cols3>button,.cell>button.pri{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:30px;font-weight:700;border-radius:24px}
.cols3>button i{font-style:normal;font-size:72px;line-height:1}
.cols3>button small{font-size:16px;font-weight:400;opacity:.85}
.cell{display:flex;flex-direction:column;gap:6px;min-height:0}
.cell>button.pri{flex:1}
.center{margin:auto;width:min(520px,90%)}
.split{flex:1;display:grid;grid-template-columns:1fr 330px;gap:22px;min-height:0}
.split2{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:22px;min-height:0}
.col{overflow:auto;min-height:0}
.side{background:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;min-height:0}
.opt{display:flex;align-items:flex-start;gap:14px;margin-bottom:8px}
.opt h2{width:120px;margin:10px 0 0;flex:none}
.opt .row{flex:1}
.sample{font-size:48px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.scorebig{font-size:34px}
/* play */
.play{flex:1;display:grid;grid-template-columns:1fr minmax(340px,38vw);grid-template-rows:auto 1fr;gap:0 24px;min-height:0}
.top{grid-column:1/3;display:flex;align-items:center;font-size:20px;color:#5a6682}
.main{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
#q{font-size:clamp(48px,min(10vw,24vh),170px);font-weight:700;font-variant-numeric:tabular-nums;min-height:1.25em;text-align:center;line-height:1.25}
#inp{font-size:clamp(40px,min(8vw,16vh),110px);letter-spacing:.12em;font-variant-numeric:tabular-nums;min-height:1.25em;color:#2f6bff;font-weight:700}
#fb{height:1.8em;font-size:28px;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:10px;min-height:0;padding-bottom:4px}
.pad button{font-size:clamp(30px,7vh,54px);padding:0;font-weight:700;border-radius:18px}
.pad button.k2{background:#e4e9f5;font-size:clamp(24px,5vh,38px)}
@media (orientation:portrait){
  .rot{display:block}
  .cols3,.cols2,.cols4,.split,.split2{grid-template-columns:1fr;overflow:auto}
  .cols3{grid-auto-rows:minmax(130px,1fr)}
  .col{overflow:visible}
  .play{display:flex;flex-direction:column}
  .pad{height:46vh;flex:none}
}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c2333;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px}

<script type="module">
/* ====== 設定 ======
   Firebaseを使う場合は、ここに設定オブジェクトを貼る（SETUP.md参照）。
   null のままなら「この端末だけ」モードで動く。 */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCz1Pz3hYiUXtxb9fnRXJmd7GSQQZxWOoM",
  authDomain: "math-app-c20b0.firebaseapp.com",
  projectId: "math-app-c20b0",
  storageBucket: "math-app-c20b0.firebasestorage.app",
  messagingSenderId: "1040508050533",
  appId: "1:1040508050533:web:912e7250d04ec89cc07a8c"
};
/* ================== */

const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms=>new Promise(r=>setTimeout(r,ms));

/* ---- 安全なlocalStorage（使えない環境ではメモリ） ---- */
const mem={};
const lsGet=k=>{try{const v=localStorage.getItem(k);return v===null?null:v}catch{return mem[k]??null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{mem[k]=v}};
const lsJSON=(k,d)=>{try{return JSON.parse(lsGet(k))??d}catch{return d}};

//#GEN-START
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const OPS={add:'＋',sub:'−',mul:'×',div:'÷'};
const OPN={add:'たし算',sub:'ひき算',mul:'かけ算',div:'わり算'};
const dg=(n,i)=>Math.floor(n/10**i)%10;
const carries=(a,b)=>{let c=0,k=0;for(let i=0;i<5;i++){const s=dg(a,i)+dg(b,i)+k;k=s>=10?1:0;c+=k}return c};
const borrows=(a,b)=>{let c=0,k=0;for(let i=0;i<5;i++){const s=dg(a,i)-dg(b,i)-k;k=s<0?1:0;c+=k}return c};
const mulCarries=(a,b)=>{let c=0,k=0;for(let i=0;i<4;i++){const p=dg(a,i)*b+k;k=Math.floor(p/10);if(k>0)c++}return c};
const until=(g,ok)=>{let x;for(let i=0;i<600;i++){x=g();if(ok(x))return x}return x};
const rd=d=>d===1?rnd(1,9):rnd(10**(d-1),10**d-1);
const mk=(da,db,ok)=>()=>until(()=>[rd(da),rd(db)],v=>ok(v[0],v[1]));
const kuku=ds=>()=>[pick(ds),rnd(1,9)];
const dv=(d,q)=>[d*q,d];
const digitsLE=(q,m,d)=>{for(let i=0;i<m;i++)if(dg(q,i)*d>=10)return false;return true};
// 計算のカリキュラム：各レベルが「ひとつのつまづきポイント」だけを練習するように分けてある
// g()は[左,右]を返す（わり算は[わられる数,わる数]）。sw:1は左右を入れ替えて出すことがある
const CURR={
  add:[
    {n:'1けた＋1けた（くり上がりなし）',g:mk(1,1,(a,b)=>a+b<=9)},
    {n:'1けた＋1けた（くり上がりあり）',g:mk(1,1,(a,b)=>a+b>=10)},
    {n:'2けた＋1けた（くり上がりなし）',sw:1,g:mk(2,1,(a,b)=>carries(a,b)===0)},
    {n:'2けた＋1けた（くり上がりあり）',sw:1,g:mk(2,1,(a,b)=>carries(a,b)===1&&a+b<100)},
    {n:'2けた＋10の倍数（34＋20）',sw:1,g:()=>until(()=>[rnd(10,89),rnd(1,8)*10],v=>v[0]+v[1]<100)},
    {n:'2けた＋2けた（くり上がりなし）',g:mk(2,2,(a,b)=>carries(a,b)===0)},
    {n:'2けた＋2けた（一の位がくり上がる）',g:mk(2,2,(a,b)=>carries(a,b)===1&&a+b<100)},
    {n:'2けた＋2けた（十の位がくり上がり100こえ）',g:mk(2,2,(a,b)=>carries(a,b)===1&&a+b>=100)},
    {n:'2けた＋2けた（くり上がり2回）',g:mk(2,2,(a,b)=>carries(a,b)===2)},
    {n:'3けた＋2けた（くり上がりなし）',sw:1,g:mk(3,2,(a,b)=>carries(a,b)===0)},
    {n:'3けた＋2けた（くり上がりあり）',sw:1,g:mk(3,2,(a,b)=>carries(a,b)>=1)},
    {n:'3けた＋3けた（くり上がりなし）',g:mk(3,3,(a,b)=>carries(a,b)===0)},
    {n:'3けた＋3けた（くり上がり1回）',g:mk(3,3,(a,b)=>carries(a,b)===1)},
    {n:'3けた＋3けた（くり上がり2回以上）',g:mk(3,3,(a,b)=>carries(a,b)>=2)},
    {n:'4けた＋3けた（くり上がりあり）',sw:1,g:mk(4,3,(a,b)=>carries(a,b)>=1)}
  ],
  sub:[
    {n:'1けた−1けた',g:mk(1,1,(a,b)=>a>b)},
    {n:'10〜18−1けた（くり下がり 13−7）',g:()=>until(()=>[rnd(11,18),rnd(2,9)],v=>v[0]%10<v[1])},
    {n:'2けた−1けた（くり下がりなし）',g:mk(2,1,(a,b)=>borrows(a,b)===0)},
    {n:'2けた−1けた（くり下がりあり）',g:mk(2,1,(a,b)=>borrows(a,b)===1)},
    {n:'2けた−10の倍数（74−30）',g:()=>until(()=>[rnd(20,99),rnd(1,9)*10],v=>v[0]>v[1])},
    {n:'2けた−2けた（くり下がりなし）',g:mk(2,2,(a,b)=>a>b&&borrows(a,b)===0)},
    {n:'2けた−2けた（くり下がりあり）',g:mk(2,2,(a,b)=>a>b&&borrows(a,b)===1)},
    {n:'100−1〜2けた（0がならぶくり下がり）',g:()=>[100,rnd(1,99)]},
    {n:'3けた−2けた（くり下がりなし）',g:mk(3,2,(a,b)=>borrows(a,b)===0)},
    {n:'3けた−2けた（くり下がり1回）',g:mk(3,2,(a,b)=>borrows(a,b)===1)},
    {n:'3けた−2けた（十の位が0 302−15）',g:()=>until(()=>[rnd(1,9)*100+rnd(0,9),rnd(10,99)],v=>v[1]%10>v[0]%10)},
    {n:'3けた−3けた（くり下がりなし）',g:mk(3,3,(a,b)=>a>b&&borrows(a,b)===0)},
    {n:'3けた−3けた（くり下がり1回）',g:mk(3,3,(a,b)=>a>b&&borrows(a,b)===1)},
    {n:'3けた−3けた（くり下がり2回）',g:mk(3,3,(a,b)=>a>b&&borrows(a,b)>=2)},
    {n:'4けた−3けた（くり下がりあり）',g:mk(4,3,(a,b)=>borrows(a,b)>=1)}
  ],
  mul:[
    {n:'九九（2・5の段）',sw:1,g:kuku([2,5])},
    {n:'九九（3・4の段）',sw:1,g:kuku([3,4])},
    {n:'九九（6・9の段）',sw:1,g:kuku([6,9])},
    {n:'九九（7・8の段）',sw:1,g:kuku([7,8])},
    {n:'九九ぜんぶ（ばらばら）',sw:1,g:()=>[rnd(2,9),rnd(2,9)]},
    {n:'0や10のかけ算（7×0、30×4）',sw:1,g:()=>Math.random()<.3?[rnd(1,9),0]:[rnd(1,9)*10,rnd(2,9)]},
    {n:'2けた×1けた（くり上がりなし）',sw:1,g:()=>until(()=>[rnd(11,99),rnd(2,9)],v=>dg(v[0],0)>0&&mulCarries(v[0],v[1])===0)},
    {n:'2けた×1けた（一の位がくり上がる）',sw:1,g:()=>until(()=>[rnd(11,99),rnd(2,9)],v=>dg(v[0],0)>0&&mulCarries(v[0],v[1])===1&&v[0]*v[1]<100)},
    {n:'2けた×1けた（十の位がくり上がり100こえ）',sw:1,g:()=>until(()=>[rnd(11,99),rnd(2,9)],v=>dg(v[0],0)>0&&mulCarries(v[0],v[1])===1&&v[0]*v[1]>=100)},
    {n:'2けた×1けた（くり上がり2回）',sw:1,g:()=>until(()=>[rnd(11,99),rnd(2,9)],v=>dg(v[0],0)>0&&mulCarries(v[0],v[1])===2)},
    {n:'3けた×1けた（くり上がりなし）',sw:1,g:()=>until(()=>[rnd(101,499),rnd(2,4)],v=>dg(v[0],0)>0&&dg(v[0],1)>0&&mulCarries(v[0],v[1])===0)},
    {n:'3けた×1けた（くり上がりあり）',sw:1,g:()=>until(()=>[rnd(101,999),rnd(2,9)],v=>mulCarries(v[0],v[1])>=1)},
    {n:'2けた×10の倍数（23×40）',sw:1,g:()=>[rnd(11,99),rnd(2,9)*10]},
    {n:'2けた×2けた（一方が11〜19）',sw:1,g:()=>[rnd(11,19),rnd(11,99)]},
    {n:'2けた×2けた（ふつう）',g:()=>[rnd(21,99),rnd(21,99)]},
    {n:'3けた×2けた',g:()=>[rnd(101,999),rnd(11,99)]}
  ],
  div:[
    {n:'九九のぎゃく（2・5の段）',g:()=>dv(pick([2,5]),rnd(1,9))},
    {n:'九九のぎゃく（3・4の段）',g:()=>dv(pick([3,4]),rnd(1,9))},
    {n:'九九のぎゃく（6・9の段）',g:()=>dv(pick([6,9]),rnd(1,9))},
    {n:'九九のぎゃく（7・8の段）',g:()=>dv(pick([7,8]),rnd(1,9))},
    {n:'九九のぎゃく ぜんぶ（ばらばら）',g:()=>dv(rnd(2,9),rnd(2,9))},
    {n:'0や1・同じ数でわる（0÷5、7÷1、8÷8）',g:()=>{const t=rnd(0,2),x=rnd(2,9);return t===0?[0,x]:t===1?[x,1]:[x,x]}},
    {n:'10の倍数÷1けた（60÷3）',g:()=>until(()=>dv(rnd(2,9),rnd(1,9)*10),v=>v[0]<100)},
    {n:'2けた÷1けた（十の位からわれる 84÷4）',g:()=>{const d=rnd(2,4),m=Math.floor(9/d);return dv(d,rnd(1,m)*10+rnd(1,m))}},
    {n:'2けた÷1けた（十の位があまる 52÷4）',g:()=>{const d=rnd(3,9);return [until(()=>rnd(20,99),a=>a%d===0&&dg(a,1)%d!==0),d]}},
    {n:'3けた÷1けた（くり下がりなし）',g:()=>{const d=rnd(2,3);return dv(d,until(()=>rnd(111,333),q=>dg(q,0)>0&&dg(q,1)>0&&digitsLE(q,3,d)))}},
    {n:'3けた÷1けた（わりきれる）',g:()=>{const d=rnd(2,9);return [until(()=>rnd(100,999),a=>a%d===0),d]}},
    {n:'2〜3けた÷2けた（わりきれる）',g:()=>dv(rnd(11,19),rnd(2,9))},
    {n:'3〜4けた÷2けた',g:()=>dv(rnd(11,30),rnd(10,40))}
  ]
};
const NST=op=>CURR[op].length;
function genCalc(c){
  const op=pick(c.ops), n=NST(op), L=Math.min(n,Math.max(1,(c.lv&&c.lv[op])||1)), st=CURR[op][L-1];
  let [a,b]=st.g();
  if(st.sw&&Math.random()<.45)[a,b]=[b,a];
  const ans=op==='add'?a+b:op==='sub'?a-b:op==='mul'?a*b:a/b;
  return {op,ans,text:`${a} ${OPS[op]} ${b}`,s:L};
}
const DIG={1:[1,9],2:[10,99],3:[100,999]};
function genFlash(c){
  const nums=[]; let total=0, prev=null;
  for(let i=0;i<c.count;i++){
    let n,t=0; do{ n=rnd(...DIG[c.digits]); }while(n===prev && t++<5);
    prev=n;
    if(i===0||!c.sign){ nums.push(n); total+=n; }
    else {
      let neg=Math.random()<0.4; if(neg&&total-n<0) neg=false;
      nums.push(neg?-n:n); total+=neg?-n:n;
    }
  }
  return {nums,ans:total};
}
// フラッシュ暗算の難易度はしご [けた数, 個数, 1こを見せるms]
const FL=[[1,3,1500],[1,3,1000],[1,4,1000],[1,5,1000],[1,5,700],[2,3,1500],[2,3,1000],[2,4,1000],[2,5,1000],[2,5,700],[3,3,1500],[3,4,1500],[3,4,1000],[3,5,1000],[3,5,700]];
//#GEN-END

/* ---- 状態 ---- */
let store=null, me=null, S=null, runId=0, CFG=null;
let isParent=false, curScreen='', PROFILES=[], parentTk=0;
const DEFAULT_CFG={
  calc:{op:'add',st:{add:3,sub:3,mul:2,div:2},n:20,sec:0,auto:true},
  flash:{digits:1,count:4,ms:1000,sign:false,n:10,auto:true}
};
const DAILY_GOAL=100;
const SEL={add:['add'],sub:['sub'],mul:['mul'],div:['div'],mixA:['add','sub'],mixM:['mul','div'],mix:['add','sub','mul','div']};
const SELN={add:'たし算',sub:'ひき算',mul:'かけ算',div:'わり算',mixA:'たし＆ひき',mixM:'かけ＆わり',mix:'ぜんぶまぜる'};
// 今の設定から、出題する種類・おまかせかどうか・種類ごとのレベルを決める（まぜる時は常におまかせ）
function calcLv(c){
  const ops=SEL[c.op]||SEL.add, auto=ops.length>1||!!c.auto, lv={};
  ops.forEach(o=>{ lv[o]=Math.min(NST(o),Math.max(1,auto?PROG.auto.calc.lv[o]:((c.st&&c.st[o])||1))); });
  return {ops,auto,lv};
}
const loadCfg=()=>{CFG=lsJSON('fa_cfg_'+me.id,null)||JSON.parse(JSON.stringify(DEFAULT_CFG));
  for(const k in DEFAULT_CFG) CFG[k]={...DEFAULT_CFG[k],...CFG[k]};};
const saveCfg=()=>lsSet('fa_cfg_'+me.id,JSON.stringify(CFG));

/* ---- 進捗：復習キューとおまかせレベル ---- */
let PROG=null, progPromise=null;
function normProg(p){
  const d={v:2,review:[],auto:{calc:{lv:{add:3,sub:3,mul:2,div:2},up:{add:0,sub:0,mul:0,div:0}},flash:{i:2,up:0}}};
  if(!p||typeof p!=='object') return d;
  const a=p.auto||{}, old=p.v!==2; // v2より前は5段階のレベルだったので、計算レベルだけ初期化する
  const lv={...d.auto.calc.lv}, up={...d.auto.calc.up};
  if(!old) for(const o in lv){ const x=+a.calc?.lv?.[o]; if(x>=1) lv[o]=Math.min(NST(o),Math.floor(x)); up[o]=+a.calc?.up?.[o]||0; }
  return {v:2,review:Array.isArray(p.review)?p.review.slice(0,30):[],
    auto:{calc:{lv,up},flash:{...d.auto.flash,...(a.flash||{})}}};
}
async function loadProg(){
  try{ PROG=normProg(await store.loadProgress(me.id)); }
  catch(e){ PROG=normProg(lsJSON('fa_prog_'+me.id,null)); }
}
const ensureProg=()=>PROG?Promise.resolve():(progPromise??=loadProg());
const resetUser=()=>{PROG=null;progPromise=null};
async function saveProg(){
  lsSet('fa_prog_'+me.id,JSON.stringify(PROG));
  try{ await store.saveProgress(me.id,PROG); }catch(e){ console.warn('progress not saved to cloud',e); }
}
function applyProgress(st){
  const msgs=[], P=PROG;
  if(st.mode==='calc'){
    const q=P.review;
    st.res.forEach(r=>{
      if(r.rv==='retry') return;
      const i=q.findIndex(x=>x.t===r.q);
      if(r.rv==='queue'){ if(i>=0){ if(r.k){ q[i].c++; if(q[i].c>=2) q.splice(i,1); } else q[i].c=0; } }
      else if(!r.k && i<0) q.push({t:r.q,o:r.o,a:r.a,s:r.s,c:0});
    });
    while(q.length>30) q.shift();
    if(st.cfg.auto){
      const A=P.auto.calc;
      for(const op of st.cfg.ops){
        const rs=st.res.filter(r=>r.o===op&&!r.rv);
        if(rs.length<4) continue;
        const acc=rs.filter(r=>r.k).length/rs.length;
        let up=false, down=false;
        if(acc>=0.9){ A.up[op]++; if((acc===1&&rs.length>=6)||A.up[op]>=2) up=true; }
        else { A.up[op]=0; if(acc<0.7) down=true; }
        if(up){ A.up[op]=0; if(A.lv[op]<NST(op)){ A.lv[op]++; msgs.push(`${OPN[op]}が Lv${A.lv[op]}「${CURR[op][A.lv[op]-1].n}」にレベルアップ！🎉`); } }
        else if(down&&A.lv[op]>1){ A.lv[op]--; A.up[op]=0; msgs.push(`${OPN[op]}を Lv${A.lv[op]}「${CURR[op][A.lv[op]-1].n}」にもどしました。ここで力をつけよう`); }
      }
    }
  } else if(st.cfg.auto && st.res.length>=3){
    const A=P.auto.flash, acc=st.res.filter(r=>r.k).length/st.res.length;
    if(acc>=0.9){ A.up++; if(A.up>=2||acc===1&&st.res.length>=5){ A.up=0; if(A.i<FL.length-1){ A.i++; msgs.push('フラッシュ暗算がレベルアップ！🎉'); } } }
    else { A.up=0; if(acc<0.7&&A.i>0){ A.i--; msgs.push('フラッシュ暗算を少しやさしくしました'); } }
  }
  return msgs;
}

async function initCloud(){
  const V='10.14.1', base=`https://www.gstatic.com/firebasejs/${V}/`;
  const [A,Au,Fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG), auth=Au.getAuth(app), db=Fs.getFirestore(app);
  store={kind:'cloud',
    async signIn(){
      const p=new Au.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
      try{await Au.signInWithPopup(auth,p)}
      catch(e){ if(e.code==='auth/popup-blocked') await Au.signInWithRedirect(auth,p); else if(e.code!=='auth/popup-closed-by-user') toast('ログインできませんでした：'+(e.code||e.message)); }
    },
    signOut:()=>Au.signOut(auth),
    save:(uid,s)=>Fs.addDoc(Fs.collection(db,'users',uid,'sessions'),s),
    async load(uid,lim=100){
      const q=Fs.query(Fs.collection(db,'users',uid,'sessions'),Fs.orderBy('ts','desc'),Fs.limit(lim));
      return (await Fs.getDocs(q)).docs.map(x=>x.data());
    },
    async loadProgress(uid){
      const x=await Fs.getDoc(Fs.doc(db,'users',uid,'state','progress'));
      return x.exists()?JSON.parse(x.data().data):null;
    },
    saveProgress:(uid,P)=>Fs.setDoc(Fs.doc(db,'users',uid,'state','progress'),{data:JSON.stringify(P),updated:Date.now()}),
    touchProfile:u=>Fs.setDoc(Fs.doc(db,'profiles',u.id),{name:u.name,email:u.email,updated:Date.now()},{merge:true}),
    async listProfiles(){ return (await Fs.getDocs(Fs.collection(db,'profiles'))).docs.map(d=>({id:d.id,...d.data()})); }
  };
  Au.onAuthStateChanged(auth,u=>{
    me=u?{id:u.uid,name:u.displayName||u.email||'ゲスト',email:u.email||''}:null;
    isParent=false; PROFILES=[]; resetUser();
    if(!me){showLogin();return}
    goHome();

    store.listProfiles().then(l=>{isParent=true;PROFILES=l;if(curScreen==='home')goHome()}).catch(()=>{});
  });
}

/* ---- ゲーム進行 ---- */
function startSession(m){
  stopTimer();
  const cfg=JSON.parse(JSON.stringify(CFG[m]));
  if(m==='calc'){ const x=calcLv(cfg); cfg.ops=x.ops; cfg.auto=x.auto; cfg.lv=x.lv; }
  else if(cfg.auto){ const L=FL[Math.min(FL.length-1,Math.max(0,PROG.auto.flash.i))]; cfg.digits=L[0]; cfg.count=L[1]; cfg.ms=L[2]; }
  S={mode:m,cfg,i:0,res:[],accepting:false,input:'',cur:null,t0:0,retry:[],rvSeen:new Set(),rvUsed:0,
     review:m==='calc'?PROG.review.filter(x=>cfg.ops.includes(x.o)):[]};
  renderPlay();
  if(m==='calc'&&cfg.sec){
    S.deadline=Date.now()+cfg.sec*1000;
    S.timer=setInterval(()=>{ if(!S) return; if(Date.now()>=S.deadline){ stopTimer(); finish(); } else setProg(); },250);
  }
  setProg();
  if(m==='calc') nextQ();
  else $('#q').innerHTML='<button class="pri big" data-act="flashGo">スタート</button>';
}
function pickCalc(){
  // 1) 同じセッションで間違えた問題を、少しあとにもう一度
  const k=S.retry.findIndex(r=>r.at<=S.i);
  if(k>=0){ const r=S.retry.splice(k,1)[0]; return {...r.item,rv:'retry'}; }
  // 2) 前に間違えた問題の復習（ときどき混ぜる）
  if(S.review.length&&S.rvUsed<5&&Math.random()<0.2){
    const pool=S.review.filter(x=>!S.rvSeen.has(x.t));
    if(pool.length){ const it=pick(pool); S.rvSeen.add(it.t); S.rvUsed++; return {op:it.o,ans:it.a,text:it.t,s:it.s,rv:'queue'}; }
  }
  return genCalc(S.cfg);
}
function nextQ(){
  if(!S.cfg.sec&&S.i>=S.cfg.n) return finish();
  setProg();
  if(S.mode==='calc'){
    S.cur=pickCalc(); $('#q').textContent=S.cur.text;
    S.input=''; S.accepting=true; S.t0=performance.now(); renderInp();
  } else flashSeq();
}

}

function submit(){
  S.accepting=false;

  const fb=$('#fb');
  fb.className=ok?'good':'bad'; fb.textContent=ok?'✓':`✗ 正解 ${S.cur.ans}`;
  S.res.push({o:S.mode==='calc'?S.cur.op:'f',s:S.cur.s,k:ok?1:0,m:ms,q:S.cur.text,a:S.cur.ans,g:S.input,rv:S.cur.rv});

  if(S.mode==='calc') nextQ();

}
function finish(){
  stopTimer(); runId++; S.accepting=false;
  const n=S.res.length;
  if(!n){ toast('時間切れ：もんだいに答えられませんでした'); goHome(); return; }

  const sess={ts:Date.now(),mode:S.mode,cfg:S.cfg,n,correct,ms,

    </div></div>`);

const fmtDate=ts=>{const d=new Date(ts),p=n=>String(n).padStart(2,'0');return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`};

function histParts(list){
  const agg={};
  list.filter(s=>s.mode==='calc'&&s.r).forEach(s=>s.r.forEach(r=>{const a=agg[r.o]??={n:0,k:0,m:0};a.n++;a.k+=r.k;a.m+=r.m}));
  const ops=Object.keys(agg);
  const left=ops.length?`<h2 style="margin-top:0">計算ダッシュ：しゅるい別（直近）</h2><table><tr><th></th><th>問題数</th><th>正答率</th><th>平均秒</th></tr>
    ${ops.map(o=>{const a=agg[o],p=Math.round(a.k/a.n*100);return `<tr><td>${OPS[o]} ${OPN[o]}</td><td>${a.n}</td><td class="${p>=90?'good':p<70?'bad':''}">${p}%</td><td>${(a.m/a.n/1000).toFixed(1)}</td></tr>`}).join('')}</table>`
    :`<p class="note">計算ダッシュの記録がたまると、しゅるい別の成績が出ます。</p>`;
  const stg={};
  list.filter(s=>s.mode==='calc'&&s.r).forEach(s=>s.r.forEach(r=>{ if(!r.s||!CURR[r.o]) return; const a=stg[r.o+':'+r.s]??={o:r.o,s:r.s,n:0,k:0,m:0};a.n++;a.k+=r.k;a.m+=r.m}));
  const ord=Object.keys(OPS), rows=Object.values(stg).sort((x,y)=>ord.indexOf(x.o)-ord.indexOf(y.o)||x.s-y.s);
  const weak=rows.filter(a=>a.n>=5&&a.k/a.n<0.7).length;
  const left2=rows.length?`<h2>つまづきチェック（レベル別）</h2>${weak?`<p class="note bad">赤いところが、まだ苦手なレベルです。</p>`:''}<table><tr><th></th><th>問題数</th><th>正答率</th><th>平均秒</th></tr>
    ${rows.map(a=>{const p=Math.round(a.k/a.n*100),w=a.n>=5&&p<70;return `<tr><td style="font-size:14px">${OPS[a.o]} Lv${a.s} ${esc(CURR[a.o][a.s-1]?.n||'')}</td><td>${a.n}</td><td class="${w?'bad':p>=90?'good':''}">${p}%</td><td>${(a.m/a.n/1000).toFixed(1)}</td></tr>`}).join('')}</table>`:'';
  const right=`<h2 style="margin-top:0">さいきんの記録</h2>`+list.slice(0,30).map(s=>{
    const p=Math.round(s.correct/s.n*100);
    return `<div class="card row"><span style="width:92px;color:#6b7691">${fmtDate(s.ts)}</span><span class="sp">${esc(cfgLabel(s))}</span>
      <b class="${p>=90?'good':p<70?'bad':''}" style="width:70px;text-align:right">${s.correct}/${s.n}</b>
      <span style="width:58px;text-align:right;color:#6b7691">${s.mode==='calc'?(s.ms/s.n/1000).toFixed(1)+'秒':''}</span></div>`}).join('');
  return {left:left+left2,right};
}
async function showHistory(){
  const hdr=`<div class="hdr"><button class="ghost" data-act="home">← もどる</button><h1>📊 きろく</h1></div>`;
  render(hdr+`<p>よみこみ中…</p>`);
  let list=[]; try{list=await store.load(me.id)}catch(e){toast('きろくを読み込めませんでした')}
  if(!list.length){ render(hdr+'<p>まだ記録がありません。</p>'); return; }
  const {left,right}=histParts(list);
  render(hdr+`<div class="split2"><div class="col">${left}</div><div class="col">${right}</div></div>`);
}

/* ---- 親用ビュー ---- */
const pct=(k,n)=>n?Math.round(k/n*100)+'%':'—';
const sumFrom=(list,from)=>{const a=list.filter(s=>s.ts>=from);return {c:a.length,n:a.reduce((x,s)=>x+s.n,0),k:a.reduce((x,s)=>x+s.correct,0)}};
function dayBars(list){
  const t0=new Date(); t0.setHours(0,0,0,0); const days=[];
  for(let i=13;i>=0;i--){const d=new Date(t0);d.setDate(d.getDate()-i);days.push({from:d.getTime(),to:d.getTime()+864e5,n:0,label:`${d.getMonth()+1}/${d.getDate()}`})}
  list.forEach(s=>{const d=days.find(x=>s.ts>=x.from&&s.ts<x.to);if(d)d.n+=s.n});
  const max=Math.max(1,...days.map(d=>d.n));
  return `<div style="display:flex;align-items:flex-end;gap:5px;height:110px">${days.map(d=>`<div style="flex:1;text-align:center"><div style="font-size:11px;color:#6b7691">${d.n||''}</div><div style="background:${d.n?'#2f6bff':'#d9deea'};height:${d.n?Math.max(4,Math.round(d.n/max*70)):3}px"></div></div>`).join('')}</div>
    <div style="display:flex;gap:5px">${days.map(d=>`<div style="flex:1;text-align:center;font-size:10px;color:#6b7691">${d.label}</div>`).join('')}</div>`;
}
async function showParent(pid){
  const tk=++parentTk;
  const hdr=`<div class="hdr"><button class="ghost" data-act="home">← もどる</button><h1>👪 親用ビュー</h1></div>`;
  const profs=PROFILES.slice().sort((a,b)=>String(a.name||a.email).localeCompare(String(b.name||b.email),'ja'));
  if(!profs.length){render(hdr+'<p>まだ誰もログインしていません。</p>');return}
  const cur=profs.find(p=>p.id===pid)||profs[0];
  const chips=`<div class="row">${profs.map(p=>`<button class="chip ${p.id===cur.id?'on':''}" data-act="child" data-id="${esc(p.id)}">${esc(p.name||p.email)}</button>`).join('')}</div><p class="note">${esc(cur.email||'')}</p>`;
  render(hdr+chips+`<p>よみこみ中…</p>`);
  let list=[]; try{list=await store.load(cur.id,200)}catch(e){toast('記録を読み込めませんでした')}
  if(tk!==parentTk) return;
  if(!list.length){ render(hdr+chips+'<p>まだ記録がありません。</p>'); return; }
  const t0=new Date(); t0.setHours(0,0,0,0);
  const today=sumFrom(list,t0.getTime()), wk=sumFrom(list,t0.getTime()-6*864e5);
  const {left,right}=histParts(list);
  const card=(t,x)=>`<div class="card sp"><div class="note" style="margin:0">${t}</div><b style="font-size:22px">${x.c}回・${x.n}問</b><div>正答率 <b>${pct(x.k,x.n)}</b></div></div>`;
  render(hdr+chips+`<div class="split2"><div class="col">
      <div class="row" style="gap:10px">${card('きょう',today)}${card('直近7日',wk)}</div>
      <h2>練習した問題数（14日間）</h2>${dayBars(list)}
      <div style="margin-top:14px">${left}</div>
      <p class="note">最後の練習：${fmtDate(list[0].ts)}</p>
    </div><div class="col">${right}</div></div>`);
}

/* ---- イベント ---- */
const acts={
  gLogin:()=>store.signIn(),
  forceLocal:()=>{lsSet('fa_force_local','1');initLocal()},
  useCloud:()=>{lsSet('fa_force_local','0');boot()},
  pickUser:d=>{me={id:d.id,name:store.profiles().find(p=>p.id===d.id).name};resetUser();goHome()},
  rename:d=>{const n=prompt('なまえ',store.profiles().find(p=>p.id===d.id).name);if(n&&n.trim()){store.rename(d.id,n.trim().slice(0,12));showLogin()}},
  logout:()=>store.signOut(),
  home:()=>goHome(),
  settings:async d=>{await ensureProg();showSettings(d.m)},
  limit:d=>{const c=CFG.calc;if(+d.n)c.n=+d.n;c.sec=+d.sec;saveCfg();showSettings('calc')},
  cfg:d=>{
    const c=CFG[d.m];
    if(d.k==='op') c.op=d.v;
    else c[d.k]=d.v==='true'?true:d.v==='false'?false:+d.v;
    saveCfg(); showSettings(d.m);
  },
  stage:d=>{
    const c=CFG.calc;
    if(calcLv(c).auto){ PROG.auto.calc.lv[d.op]=+d.v; PROG.auto.calc.up[d.op]=0; saveProg(); }
    else { (c.st??={})[d.op]=+d.v; saveCfg(); }
    showSettings('calc');
  },
  start:async d=>{await ensureProg();startSession(d.m)},
  flashGo:()=>nextQ(),
  history:()=>showHistory(),
  parent:()=>showParent(PROFILES.find(p=>p.id!==me.id)?.id),
  child:d=>showParent(d.id)
};
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)acts[b.dataset.act]?.(b.dataset)});
$('#app').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-key]');if(b){e.preventDefault();press(b.dataset.key)}});
document.addEventListener('keydown',e=>{
  if(!S)return;
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==='Backspace') press('back');
  else if(e.key==='Enter'){ if(S.accepting) press('ok'); else if(!S.cur&&S.mode==='flash') acts.flashGo(); }
});

async function boot(){
  if(FIREBASE_CONFIG && lsGet('fa_force_local')!=='1'){
    try{await initCloud();return}catch(e){console.error(e);toast('オンラインに接続できないため、この端末だけのモードで開きます')}
  }
  initLocal();
}
boot();
</script>
